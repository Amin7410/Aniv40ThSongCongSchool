version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: '07:00', timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 10
    groups:
      payload: { patterns: ['payload', '@payloadcms/*'] }
      next-react: { patterns: ['next', 'react', 'react-dom', 'eslint-config-next'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
