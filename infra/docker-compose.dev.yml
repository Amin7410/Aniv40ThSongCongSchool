# Dịch vụ phụ trợ cho máy dev: docker compose -f infra/docker-compose.dev.yml up -d
name: bosss-dev
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: bosss, POSTGRES_USER: postgres, POSTGRES_HOST_AUTH_METHOD: trust }
    ports: ['5432:5432']
    volumes: [pgdev:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
volumes: { pgdev: {} }
