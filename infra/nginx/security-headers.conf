# Header bảo mật — include ở server VÀ ở mọi location có add_header riêng
# (nginx không kế thừa add_header từ cấp cha khi location tự khai báo add_header).
# CSP do ứng dụng đặt (có nonce, sinh mỗi request trong src/proxy.ts). Trang tĩnh dự phòng có CSP riêng.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP: Next.js cần 'unsafe-inline' cho script khởi tạo nếu chưa bật nonce (việc của S2: middleware nonce).
