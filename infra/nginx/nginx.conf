user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
events { worker_connections 16384; multi_accept on; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on; tcp_nopush on; keepalive_timeout 30s;
  client_max_body_size 30m;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml text/plain; gzip_min_length 1024;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent $request_time "$upstream_cache_status"';
  access_log /var/log/nginx/access.log main buffer=64k flush=5s;

  # Giới hạn tần suất (tầng 1; tầng 2 nằm trong ứng dụng theo Redis)
  limit_req_zone  $binary_remote_addr zone=pages:20m  rate=20r/s;
  limit_req_zone  $binary_remote_addr zone=api:20m    rate=10r/s;
  limit_req_zone  $binary_remote_addr zone=post:20m   rate=2r/s;
  limit_req_zone  $binary_remote_addr zone=login:10m  rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=conn:20m;
  limit_req_status 429; limit_conn_status 429;

  # Micro-cache: gánh tải ngày lễ cho các trang công khai
  proxy_cache_path /var/cache/nginx/micro levels=1:2 keys_zone=micro:50m max_size=1g inactive=10m use_temp_path=off;

  upstream web {
    least_conn;
    server web1:3000 max_fails=3 fail_timeout=10s;
    server web2:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  # Người đã đăng nhập quản trị không dùng cache
  map $http_cookie $skip_cache { default 0; ~*payload-token 1; }

  include /etc/nginx/conf.d/*.conf;
}
