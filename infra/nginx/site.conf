# Thay phongtruyenthong.example.edu.vn bằng tên miền chính thức (quyết định D1).
server {
  listen 80;
  server_name phongtruyenthong.example.edu.vn;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name phongtruyenthong.example.edu.vn;

  ssl_certificate     /etc/letsencrypt/live/phongtruyenthong.example.edu.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/phongtruyenthong.example.edu.vn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:20m;

  include /etc/nginx/snippets/security-headers.conf;

  limit_conn conn 40;

  # IP thật cho ứng dụng: GHI ĐÈ header do client gửi (ứng dụng chỉ tin X-Real-IP)
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  # Chứng minh với ứng dụng rằng request đi qua Nginx này (ứng dụng chỉ tin X-Real-IP khi khớp)
  proxy_set_header X-Proxy-Auth "${PROXY_SHARED_SECRET}";
  # Không cho client tự gửi các header nội bộ
  proxy_set_header X-Health-Token "";
  proxy_set_header X-Nonce "";
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  # Công tắc dự phòng: tạo tệp /usr/share/nginx/fallback/ON để phục vụ trang tĩnh (runbook 15.1)
  if (-f /usr/share/nginx/fallback/ON) { rewrite ^/(?!fallback/).*$ /fallback/index.html last; }
  location /fallback/ {
    alias /usr/share/nginx/fallback/;
    add_header Cache-Control "no-store";
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    include /etc/nginx/snippets/security-headers.conf;
  }
  error_page 502 503 504 /fallback/index.html;

  # Quản trị: chỉ từ mạng quản trị (WireGuard / IP văn phòng trường) — sửa danh sách cho phù hợp
  # Quản trị và API đăng nhập: chỉ từ mạng được phép (danh sách trong admin-allow.conf).
  location /admin { include /etc/nginx/snippets/admin-allow.conf; proxy_pass http://web; }
  location /mfa { include /etc/nginx/snippets/admin-allow.conf; proxy_pass http://web; }
  location /quan-tri { include /etc/nginx/snippets/admin-allow.conf; proxy_cache off; proxy_pass http://web; }
  location /api/staff/ { include /etc/nginx/snippets/admin-allow.conf; limit_req zone=login burst=5 nodelay; proxy_pass http://web; }
  location = /api/users/login { include /etc/nginx/snippets/admin-allow.conf; limit_req zone=login burst=5 nodelay; proxy_pass http://web; }
  location ~ ^/api/(users|audit-logs|submissions|submission-files|globals|payload-preferences|payload-locked-documents) { include /etc/nginx/snippets/admin-allow.conf; limit_req zone=api burst=30 nodelay; proxy_pass http://web; }

  # SSE ngày lễ
  location /api/public/live/stream {
    proxy_pass http://web;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    add_header X-Accel-Buffering no;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location /api/public/submissions { limit_req zone=post burst=5 nodelay; proxy_pass http://web; }
  location /api/public/ { limit_req zone=api burst=30 nodelay; proxy_pass http://web; }
  location /api/ { limit_req zone=api burst=30 nodelay; proxy_pass http://web; }

  # Tệp tĩnh có hash — cache lâu
  location /_next/static/ { proxy_pass http://web; expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/snippets/security-headers.conf; }

  # Trang công khai: micro-cache 5 giây (tắt với người đã đăng nhập)
  location / {
    limit_req zone=pages burst=60 nodelay;
    proxy_cache micro;
    proxy_cache_key $scheme$host$request_uri;
    proxy_cache_valid 200 404 5s;
    proxy_cache_lock on;
    proxy_cache_use_stale updating error timeout http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_ignore_headers Cache-Control Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_cache_bypass $skip_cache;
    proxy_no_cache $skip_cache;
    add_header X-Cache $upstream_cache_status;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://web;
  }
}
