<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phòng truyền thống trực tuyến – Trường THPT Sông Công (1986 – 2026)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap">
<style>
:root{
  --bg:#ece0c8;--surface:#faf3e3;--surface-2:#f1e3c6;--ink:#2a1a12;--muted:#6a5241;--line:#d6bf96;--accent:#8e1418;
  --lacquer:#8e1418;--lacquer-d:#5c0a0e;--gold:#d4ab55;--gold-l:#f1d48b;--gold-d:#9a7330;--ok:#2f7a3a;--danger:#b3261e;--sea:#cfe3ee;--land:#f3ead6;
  --serif:"Cormorant Garamond","Noto Serif",Georgia,"Times New Roman",serif;
  --sans:"Be Vietnam Pro","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150c08;--surface:#21140d;--surface-2:#2c1a10;--ink:#f1e3c9;--muted:#bda287;--line:#4d3322;--accent:#ecc57a;--ok:#7cc48a;--danger:#ff8a80;--sea:#17303b;--land:#3a2b1f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150c08;--surface:#21140d;--surface-2:#2c1a10;--ink:#f1e3c9;--muted:#bda287;--line:#4d3322;--accent:#ecc57a;--ok:#7cc48a;--danger:#ff8a80;--sea:#17303b;--land:#3a2b1f;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img,video{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
img.old{filter:sepia(.75) saturate(.75)}
h1,h2,h3{text-wrap:balance}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(#5c0a0e,#4a080b);color:var(--gold-l);border-bottom:1px solid rgba(212,171,85,.4)}
.top-row{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0;flex:1}
.brand svg{width:42px;height:28px;color:var(--gold);flex:none}
.brand>span{min-width:0}
.brand b{display:block;font-family:var(--serif);font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span span{display:block;font-size:12px;color:#e8c98a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlink{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;border:1px solid rgba(241,212,139,.4);color:#f3dfb2;text-decoration:none;font-size:13.5px;background:none}
.tlink.hl{background:var(--gold-l);color:#4a080b;border-color:var(--gold-l);font-weight:600}
.tlink svg{width:16px;height:16px}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#c8102e;color:#fff;font-size:11.5px;font-weight:700}
@media (max-width:640px){.tlink .lbl{display:none}.tlink{padding:0 10px}.brand b{font-size:18px}.hide-sm{display:none}}
.tabs-wrap{background:#4a080b;border-bottom:2px solid var(--gold-d)}
.tabs{max-width:1280px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:6px 12px;border-radius:999px;border:1px solid rgba(241,212,139,.35);color:#f3dfb2;text-decoration:none;font-size:13px;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--gold-l);color:var(--lacquer-d);border-color:var(--gold-l);font-weight:600}
.demo-bar{background:var(--gold-l);color:#4a080b;font-size:13px;padding:7px 16px;text-align:center}

/* hall */
.hall{max-width:1280px;margin:0 auto}
.room{position:relative;overflow:hidden;background:#2c150a}
@media (min-width:900px){.hall{padding:18px 16px 0}.room{border-radius:14px;box-shadow:0 22px 50px rgba(40,10,0,.35)}}
.ceiling{position:relative;height:42px;background:linear-gradient(#f3eadb,#ddcdb0);display:flex;justify-content:space-around;align-items:center;padding:0 8%}
.ceiling i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#fffdf2 0 40%,#ffe2a0 70%,#d9b56e);box-shadow:0 0 16px 6px rgba(255,222,150,.75)}
.ceiling::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:linear-gradient(#d9b36d,#8a5524 60%,#4a2614)}
.wall{position:relative;padding:22px clamp(16px,3.4vw,40px) 26px;background:radial-gradient(60% 55% at 50% 0%,rgba(255,214,150,.30),transparent 70%),radial-gradient(28% 45% at 12% 0%,rgba(255,214,150,.22),transparent 70%),radial-gradient(28% 45% at 88% 0%,rgba(255,214,150,.22),transparent 70%),repeating-linear-gradient(90deg,rgba(0,0,0,.10) 0 1px,transparent 1px 34px),linear-gradient(180deg,#a2191e 0%,#841116 55%,#6a0c10 100%);box-shadow:inset 18px 0 0 #3a1c0d,inset 22px 0 0 #8a5228,inset -18px 0 0 #3a1c0d,inset -22px 0 0 #8a5228}
.room.first .wall::before{content:"";position:absolute;inset:0;background:#1a0503;opacity:.7;z-index:3;pointer-events:none;animation:lights 1.5s .25s ease-out forwards}
.room.first .ceiling i{opacity:.25;animation:bulbs .9s .2s ease-out forwards}
@keyframes lights{to{opacity:0}}@keyframes bulbs{to{opacity:1}}
.banner{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.6vw,16px);margin:0 auto 22px;max-width:900px;padding:10px 16px;background:linear-gradient(#7a0d12,#56080c);border:2px solid var(--gold-d);box-shadow:inset 0 0 0 3px #4a060a,inset 0 0 0 4px rgba(241,212,139,.45),0 6px 16px rgba(0,0,0,.35);border-radius:3px}
.banner svg{width:clamp(26px,4vw,50px);height:auto;color:var(--gold);flex:none}
.banner h1{margin:0;font-family:var(--serif);font-weight:700;text-transform:uppercase;text-align:center;font-size:clamp(14px,2.6vw,30px);line-height:1.15;letter-spacing:.03em;background:linear-gradient(#fff3c8,#e8c26c 55%,#b8893a);-webkit-background-clip:text;background-clip:text;color:transparent}
.wall-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,250px) minmax(0,1fr);gap:24px;align-items:end;max-width:1060px;margin:0 auto}
.panel{position:relative;background:linear-gradient(#fbf3df,#efe0bf);color:#3a2414;border:3px solid #c79a4b;border-radius:50% 50% 10px 10px/34px 34px 10px 10px;padding:34px 18px 18px;box-shadow:inset 0 0 0 6px #fbf3df,inset 0 0 0 7px #d8b56e,0 12px 26px rgba(0,0,0,.4);text-align:center;min-height:420px;display:flex;flex-direction:column;gap:8px;font:inherit;appearance:none;cursor:pointer;width:100%}
.ph2{display:block;margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(20px,2.3vw,27px);line-height:1.12;color:#8e1418}
.psub{display:block;margin:0;font-size:12.5px;color:#6a4a32;line-height:1.4}
.paper{display:block;background:#fffdf7;border:1px solid #e1d3b6;box-shadow:0 2px 6px rgba(80,40,10,.15);padding:14px 12px;margin:6px 4px 0;flex:1}
.paper b{display:block;font-size:8.5px;text-transform:uppercase;color:#3a2414}
.paper em{display:block;font-size:8px;font-style:normal;font-weight:600;color:#3a2414;margin-bottom:10px}
.paper strong{display:block;font-size:12.5px;text-transform:uppercase;color:#8e1418;margin-bottom:8px;letter-spacing:.06em}
.paper i{display:block;height:3px;border-radius:2px;background:#ddd0b6;margin:8px 4px}
.paper i.s{width:55%}
.plink{font-size:13.5px;font-weight:600;color:#8e1418;text-decoration:underline;text-underline-offset:3px}
.hist{list-style:none;margin:6px 0 0;padding:0;text-align:left;flex:1;display:flex;flex-direction:column;gap:8px}
.hist li{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:baseline;font-size:12.5px;line-height:1.4;color:#3a2414;border-bottom:1px dashed #e0cfaa;padding-bottom:7px}
.hist b{font-family:var(--serif);font-size:19px;color:#8e1418;line-height:1}
.altar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.flags{display:flex;gap:6px;margin-bottom:10px}
.flags svg{width:clamp(60px,7vw,88px);height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.bust{width:clamp(118px,14vw,172px);height:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.flowers{width:clamp(160px,19vw,232px);height:auto;margin-top:-30px;position:relative}
.pedestal{width:clamp(96px,10vw,132px);height:clamp(70px,9vw,118px);margin-top:-12px;background:linear-gradient(90deg,#2c150a,#5a2e15 30%,#7a4422 50%,#4a2614 75%,#2c150a);border-radius:3px 3px 0 0;box-shadow:0 0 0 2px #2c150a,0 10px 20px rgba(0,0,0,.4);position:relative}
.pedestal::before{content:"";position:absolute;left:14px;right:14px;top:12px;height:22px;border:1px solid rgba(212,171,85,.6);border-radius:2px}
.step{height:14px;background:linear-gradient(#9a161b,#5c0a0e)}
.floor{height:40px;background:linear-gradient(180deg,rgba(255,240,210,.35),transparent 60%),repeating-linear-gradient(90deg,rgba(80,50,20,.18) 0 1px,transparent 1px 90px),linear-gradient(#d6c4a1,#bba783)}
@media (max-width:760px){
  .wall{padding:18px 16px 20px;box-shadow:inset 8px 0 0 #3a1c0d,inset 10px 0 0 #8a5228,inset -8px 0 0 #3a1c0d,inset -10px 0 0 #8a5228}
  .wall-grid{grid-template-columns:1fr 1fr;grid-template-areas:"altar altar" "dec his";gap:12px;align-items:stretch}
  .altar{grid-area:altar}.panel.dec{grid-area:dec}.panel.his{grid-area:his}
  .panel{min-height:0;padding:24px 9px 12px;border-radius:50% 50% 8px 8px/22px 22px 8px 8px}
  .ph2{font-size:19px}.psub{font-size:11px}.hist li{grid-template-columns:1fr;gap:0;font-size:11px}.hist b{font-size:16px}.hist li:nth-child(n+5){display:none}
  .floor{height:24px}
}
@media (prefers-reduced-motion:reduce){.room.first .wall::before{display:none}.room.first .ceiling i{opacity:1;animation:none}}

/* sections */
.section{max-width:1280px;margin:0 auto;padding:30px 16px}
.section-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.section-head h2{font-family:var(--serif);font-size:clamp(30px,4.4vw,42px);line-height:1.05;margin:0;color:var(--accent)}
.section-head p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--lacquer);background:var(--lacquer);color:#fbe7bd;padding:10px 16px;border-radius:6px;font-weight:600;font-size:15px;text-decoration:none;line-height:1.2}
.btn svg{width:17px;height:17px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.gold{background:var(--gold-l);color:#4a080b;border-color:var(--gold-l)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:6px 11px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.act{appearance:none;display:grid;grid-template-columns:44px 1fr;gap:4px 14px;align-items:center;text-align:left;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink)}
.act svg{grid-row:span 2;width:44px;height:44px;padding:10px;border-radius:50%;background:var(--lacquer);color:var(--gold-l)}
.act b{font-size:16px}.act span{font-size:13.5px;color:var(--muted)}
.cd-band{background:radial-gradient(70% 140% at 50% 0%,rgba(255,214,150,.22),transparent 70%),linear-gradient(#7a0d12,#4e070b);color:#f6e7c8;border-top:3px solid var(--gold-d);border-bottom:3px solid var(--gold-d)}
.cd-in{max-width:1280px;margin:0 auto;padding:26px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px 28px}
.cd-in h2{font-family:var(--serif);font-size:clamp(26px,3.6vw,38px);margin:0;line-height:1.08;color:var(--gold-l)}
.cd-in p{margin:6px 0 0;color:#efd9ad}
.cd{display:flex;gap:10px}
.cd div{min-width:68px;text-align:center;padding:8px 6px;border:1px solid rgba(241,212,139,.4);border-radius:8px;background:rgba(0,0,0,.18)}
.cd b{display:block;font-family:var(--serif);font-size:36px;line-height:1;color:#fff3c8;font-variant-numeric:tabular-nums}
.cd span{font-size:12px;color:#e8c98a}
.cd-acts{display:flex;gap:10px;flex-wrap:wrap}
.cabinets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.cab{display:flex;flex-direction:column;text-decoration:none;color:#f3e2bf;background:linear-gradient(160deg,#6e3b1e,#4a2614 55%,#3a1c0d);border-radius:8px;padding:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 22px rgba(40,12,0,.28)}
.cab .plate{background:linear-gradient(#93161b,#5c0a0e);border:1px solid var(--gold-d);border-radius:4px;padding:8px 10px;text-align:center;font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.15;color:var(--gold-l);min-height:64px;display:flex;align-items:center;justify-content:center}
.cab .glass{margin-top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;background:linear-gradient(180deg,#fbeccb,#f2e3c4);border-radius:3px;box-shadow:inset 0 0 0 1px rgba(154,115,48,.6)}
.cab .glass img{width:100%;aspect-ratio:4/5;object-fit:cover;border:2px solid #b88c3f;background:#5c0a0e}
.cab.wide .glass img{aspect-ratio:4/3}
.cab.objs .glass{background:radial-gradient(circle at 50% 30%,#a3181d,#5c0a0e)}
.cab.objs .glass img{object-fit:contain;border:0;background:none}
.cab .meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:13.5px;color:#e9cf98}
.cab .meta span:last-child{text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* zone pages */
.zone-hero{background:radial-gradient(70% 120% at 50% 0%,rgba(255,214,150,.25),transparent 70%),repeating-linear-gradient(90deg,rgba(0,0,0,.1) 0 1px,transparent 1px 34px),linear-gradient(#9a161b,#6a0c10);color:var(--gold-l)}
.zone-hero-in{max-width:1280px;margin:0 auto;padding:20px 16px 28px}
.back{color:#f3dcb0;font-size:14px;text-decoration:none}
.zone-hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(32px,5.4vw,54px);line-height:1.04;margin:8px 0 8px;background:linear-gradient(#fff3c8,#e8c26c 60%,#c4954a);-webkit-background-clip:text;background-clip:text;color:transparent}
.zone-hero p{margin:0;max-width:64ch;color:#f3dcb0}
.toolbar{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;margin-bottom:22px}
.search{position:relative;flex:1 1 240px;max-width:380px}
.search input{width:100%;padding:10px 12px 10px 38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.count{color:var(--muted);font-size:14px}
.chips{flex:1 1 100%;display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chips>small{flex:none;color:var(--muted);font-size:13px;margin-right:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 13px;border-radius:999px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--lacquer);color:#fbe7bd;border-color:var(--lacquer)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--lacquer);color:#fbe7bd;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
@media (max-width:480px){.pgrid{grid-template-columns:1fr 1fr;gap:18px 12px}}
.pcard,.gcard{appearance:none;border:0;background:none;padding:0;display:flex;flex-direction:column}
.pcard{text-align:center;align-items:center}
.frame{display:block;width:100%;padding:5px;background:linear-gradient(135deg,#f5dc9c,#a97b2f 38%,#f1d08a 62%,#8b6224);border-radius:3px;box-shadow:0 6px 14px rgba(40,15,0,.25)}
.frame img{width:100%;aspect-ratio:4/5;object-fit:cover;border:2px solid #5a3a14;background:#5a3a14}
.pcard b{display:block;margin-top:9px;font-weight:600;font-size:15px;line-height:1.3}
.pcard span{display:block;font-size:13px;color:var(--muted);line-height:1.4;margin-top:2px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px 20px}
@media (max-width:480px){.ggrid{grid-template-columns:1fr 1fr;gap:18px 12px}}
.gcard{text-align:left}
.ph{position:relative;display:block;background:#fff;padding:6px;box-shadow:0 1px 2px rgba(0,0,0,.15),0 8px 18px rgba(50,20,0,.18);margin-bottom:9px}
.ph img{width:100%;aspect-ratio:3/2;object-fit:cover;background:#ddd}
.ph .play{position:absolute;inset:0;display:grid;place-items:center}
.ph .play svg{width:46px;height:46px;color:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.gcard b{font-weight:600;font-size:15px;line-height:1.35}
.gcard .m{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.gcard .m svg{width:14px;height:14px;vertical-align:-2px}
.grp{font-family:var(--serif);font-size:30px;line-height:1.1;color:var(--accent);margin:0 0 18px;display:flex;align-items:center;gap:14px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
* + .grp{margin-top:44px}
.empty{color:var(--muted);padding:20px 0}
.note{font-size:13px;color:var(--muted)}
/* leaders timeline */
.ltl{list-style:none;margin:0;padding:0;position:relative}
.ltl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(var(--gold),var(--gold-d));transform:translateX(-1px)}
.ltl li{position:relative;width:50%;padding:0 34px 30px 0}
.ltl li:nth-child(even){margin-left:50%;padding:0 0 30px 34px}
.ltl li::before{content:"";position:absolute;top:10px;right:-9px;width:18px;height:18px;border-radius:50%;background:var(--lacquer);box-shadow:0 0 0 3px var(--gold)}
.ltl li:nth-child(even)::before{left:-9px;right:auto}
.ltl-yr{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--accent);margin:0 0 8px;text-align:right;line-height:1.2}
.ltl li:nth-child(even) .ltl-yr{text-align:left}
.lcard{appearance:none;display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;width:100%}
.lcard b{font-size:17px;display:block;line-height:1.3}
.lcard span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.lcard em{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-style:normal;font-size:12.5px;color:var(--accent);font-weight:600}
.lcard em svg{width:14px;height:14px}
@media (max-width:720px){.ltl::before{left:9px}.ltl li,.ltl li:nth-child(even){width:auto;margin-left:0;padding:0 0 26px 36px}.ltl li::before,.ltl li:nth-child(even)::before{left:0;right:auto}.ltl-yr,.ltl li:nth-child(even) .ltl-yr{text-align:left}.lcard{grid-template-columns:84px 1fr}}
/* awards case */

function subscribe(){
  const db=CAP.db,warn=e=>console.warn("db",e&&e.code);
  db.collection("content").onSnapshot(s=>{s.docs.forEach(d=>{const v=d.data()||{};if(d.id==="site")D.site=Object.assign(clone(DEFAULT_SITE),clone(v));else if(ZMAP[d.id]&&Array.isArray(v.items))D.zones[d.id]=clone(v.items)});changed()},warn);
  db.collection("guestbook").orderBy("at","desc").limit(400).onSnapshot(s=>{D.guestbook=s.docs.map(d=>Object.assign({_id:d.id},d.data()));changed()},warn);
  db.collection("tributes").limit(1000).onSnapshot(s=>{D.tributes=s.docs.map(d=>Object.assign({_id:d.id},d.data()));changed()},warn);
  db.collection("donations").limit(1000).onSnapshot(s=>{D.donations=s.docs.map(d=>Object.assign({_id:d.id},d.data()));changed()},warn);
  db.collection("pins").limit(1000).onSnapshot(s=>{D.pins=s.docs.map(d=>Object.assign({_id:d.id},d.data()));changed()},warn);
  db.collection("candles").limit(1000).onSnapshot(s=>{D.candles=s.docs.map(d=>d.id);changed()},warn);
  if(ME.id)db.doc("inbox/"+ME.id).onSnapshot(s=>{D.myInbox=s.exists?clone(s.data()):null;changed()},warn);
  if(ME.edit){
    db.doc("admin/roles").onSnapshot(s=>{D.roles=s.exists?clone(s.data()):{};computeRole();changed();if(PAGE.name==="quan-tri")render()},warn);

function resizeImage(file,max){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=mk(Math.round(im.width*s),Math.round(im.height*s));c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error("x")),"image/jpeg",.86)};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("x"))};im.src=url})}
async function prepMedia(file){
  if(/^image\//.test(file.type)){const b=await resizeImage(file,1600);return {blob:b,type:"image/jpeg",kind:"image"}}

function flowersSVG(){const r=rng(7);let s='<defs><radialGradient id="fl" cx="40%" cy="35%"><stop offset="0" stop-color="#ffe3ec"/><stop offset=".6" stop-color="#ec8fb0"/><stop offset="1" stop-color="#b83a68"/></radialGradient></defs>';
  for(let i=0;i<14;i++){const a=Math.PI*(i/13),x=100-Math.cos(a)*88,y=66-Math.sin(a)*34;s+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="13" ry="6" transform="rotate(${(-Math.cos(a)*35).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${i%2?"#2f6b34":"#3f8a43"}"/>`}
  [[9,18,182,60],[7,34,166,44],[4,62,138,30]].forEach(([n,a,b,y])=>{for(let i=0;i<n;i++){const x=a+(b-a)*i/(n-1);s+=`<circle cx="${x.toFixed(1)}" cy="${(y+r()*3).toFixed(1)}" r="10.5" fill="url(#fl)"/><circle cx="${x.toFixed(1)}" cy="${(y-1).toFixed(1)}" r="3.5" fill="#f6c6d6"/>`}});
  return `<svg class="flowers" viewBox="0 0 200 80" aria-hidden="true">${s}</svg>`}
const fdate=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||"");return m?`${m[3]}/${m[2]}/${m[1]}`:s};

function cab(z){const items=zoneItems(z.id),objs=z.type==="awards",wide=z.type==="gallery"||z.type==="campus";

function eventDate(){const s=D.site.eventAt||"";const d=new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(s)?s:s+":00+07:00");return isNaN(d)?null:d}
function cdHTML(){const d=eventDate();if(!d)return "";let ms=d-Date.now();if(ms<=0)return `<div style="min-width:auto;padding:10px 16px"><b style="font-size:24px">${liveState()==="after"?"Đại lễ đã diễn ra":"Đại lễ đang diễn ra"}</b></div>`;
  const u=[[864e5,"ngày"],[36e5,"giờ"],[6e4,"phút"],[1e3,"giây"]].map(([k,l])=>{const v=Math.floor(ms/k);ms-=v*k;return `<div><b>${String(v).padStart(2,"0")}</b><span>${l}</span></div>`});return u.join("")}
function countdownBand(){const s=D.site,d=eventDate();return `<section class="cd-band"><div class="cd-in"><div><h2>${esc(s.eventTitle)}</h2><p>${d?d.toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit",year:"numeric",timeZone:"Asia/Ho_Chi_Minh"}):""}${s.eventPlace?", "+esc(s.eventPlace):""}</p>${R("peersB",peersLine)}</div><div class="cd" data-cd>${cdHTML()}</div><div class="cd-acts"><a class="btn gold" href="#/dai-le">Gửi lời chúc</a>${s.livestream?`<a class="btn ghost" style="color:#f6e7c8;border-color:rgba(241,212,139,.5)" href="${esc(safeURL(s.livestream))}" target="_blank" rel="noopener">${I.live} ${liveState()==="after"?"Xem lại buổi lễ":"Xem trực tiếp"}</a>`:""}</div></div></section>`}

  wrap.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4)drag.moved=true;if(drag.moved){const s=MAP.w/drag.rw;setMap(drag.mx-dx*s,drag.my-dy*s,MAP.w)}});
  wrap.addEventListener("pointerup",e=>{const d=drag;drag=null;if(d&&!d.moved&&MAP.pick){const svg=$("#mapSvg"),r=svg.getBoundingClientRect(),x=MAP.x+(e.clientX-r.left)/r.width*MAP.w,y=MAP.y+(e.clientY-r.top)/r.height*MAP.h;MAP.pickPt=[x,y];MAP.pick=false;wrap.classList.remove("pick");$("#mapBanner").hidden=true;setMap(MAP.x,MAP.y,MAP.w);pinForm({lat:+(((250-y)*180/500)).toFixed(3),lng:+((x/1000*360)-180).toFixed(3)})}else if(d&&!d.moved)$("#mapPop").hidden=true});
  wrap.addEventListener("wheel",e=>{e.preventDefault();const svg=$("#mapSvg"),r=svg.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height,f=e.deltaY>0?1.2:1/1.2,nw=Math.max(60,Math.min(1000,MAP.w*f));setMap(MAP.x+fx*(MAP.w-nw),MAP.y+fy*(MAP.h-nw/2),nw)},{passive:false});
}

function memFiles(files){const imgs=files.filter(f=>/^image\//.test(f.type));if(imgs.length<files.length)toast("Chỉ nhận tệp ảnh.");if(MEMF.length+imgs.length>5)toast("Mỗi lần gửi tối đa 5 ảnh.");MEMF=MEMF.concat(imgs).slice(0,5);

async function memSend(){clearBad();const v=id=>$("#"+id).value.trim(),name=v("mName"),khoa=v("mKhoa"),type=v("mType"),title=v("mTitle"),story=v("mStory"),year=+v("mYear")||0;let ok=true;

async function memApprove(uid,x){const it={id:"goc-ky-uc-"+newId(),title:String(x.title||"Kỷ vật").slice(0,100),desc:String(x.story||"").slice(0,1200),type:MEM_T.some(t=>t[0]===x.type)?x.type:"anh",khoa:String(x.khoa||"").slice(0,40),by:String(x.name||"Cựu học sinh").slice(0,80),year:+x.year||0,at:x.at||Date.now(),approvedAt:Date.now()};it.sub=it.khoa;

function boxHTML(){const pool=boxPool(),seen=seenGet(),got=pool.filter(p=>seen.includes(p.id)).length,c=BOX.cur;
  const chips=`<div class="chips" role="group" aria-label="Thế hệ của tôi">${["Tất cả"].concat(GENS.map(g=>g[0])).map(v=>`<button class="chip" data-act="boxGen" data-v="${esc(v)}" aria-pressed="${v===BOX.gen}">${esc(v==="Tất cả"?"Mọi thế hệ":v.replace("Thế hệ ",""))}</button>`).join("")}</div>`;
  return `<div class="mbox"><div class="mbox-l"><button class="tin${BOX.anim?" shake":""}" data-act="boxDraw" aria-label="Bốc một ký ức ngẫu nhiên"><span class="tin-lid"></span><span class="tin-body"><span class="tin-label">Hộp ký ức</span></span></button><button class="btn" data-act="boxDraw">Bốc một ký ức</button>${chips}<p class="note" style="margin:0">Bạn đã săn được ${got}/${pool.length} ký ức${BOX.gen!=="Tất cả"?" của "+esc(BOX.gen.toLowerCase()):""}.</p><div class="bar"><i style="width:${pool.length?(got/pool.length*100).toFixed(1):0}%"></i></div></div>
    <div>${c?`<figure class="reveal"><span class="mph"><img src="${imgOf(c.it,true)}" alt="${esc(c.title)}"${c.it.old&&c.it.gen?' class="old"':""}></span><figcaption><h3>${esc(c.title)}</h3><p>${esc(c.story)}</p><small>${esc(c.meta)}</small><div class="actions" style="justify-content:flex-start;margin-top:14px"><button class="btn" data-act="boxDraw">Bốc tiếp</button><button class="btn ghost" data-act="item" data-id="${esc(c.id)}">Xem đầy đủ</button></div></figcaption></figure>`:`<div class="reveal-empty"><p style="margin:0 0 6px;font-weight:600;color:var(--ink)">Chiếc hộp đang giữ ${pool.length} ký ức.</p><p style="margin:0">Mỗi lần bấm là một tấm ảnh cũ và một câu chuyện học trò. Chọn thế hệ của bạn rồi săn lại khoảnh khắc thanh xuân của khóa mình.</p></div>`}</div></div>`}
function boxDraw(){if(BOX.anim)return;const pool=boxPool();if(!pool.length){toast("Thế hệ này chưa có ký ức nào. Hãy là người đầu tiên gửi kỷ vật!");return}
  const seen=seenGet(),cur=BOX.cur&&BOX.cur.id;let cand=pool.filter(p=>!seen.includes(p.id)&&p.id!==cur),all=false;if(!cand.length){all=true;cand=pool.filter(p=>p.id!==cur);if(!cand.length)cand=pool}
  const pick=cand[Math.floor(Math.random()*cand.length)];BOX.anim=true;refreshRegions();
  setTimeout(()=>{BOX.anim=false;BOX.cur=pick;seenAdd(pick.id);refreshRegions();if(all)toast("Bạn đã săn đủ ký ức của thế hệ này! Hộp sẽ trộn lại để bạn xem lại.")},reduced()?60:650)}

/* ===================== Đếm ngược, phát trực tiếp ===================== */
let LIVEPREV=false,EMBED_BLOCKED=false,MINI=false,ROOMC=null,RX_OK=true,lastRx=0,PEERS={total:0,watch:0,known:false};
const RX={tim:"❤️",votay:"👏",chuc:"🎉",hoa:"🌸"},RXL={tim:"thả tim",votay:"vỗ tay",chuc:"chúc mừng",hoa:"tặng hoa"};
function liveState(){const s=D.site;if(LIVEPREV||s.liveMode==="on")return "live";const d=eventDate();if(!d)return "before";const now=Date.now(),st=+d-30*6e4,en=+d+(+s.liveHours||4)*36e5;if(s.liveMode==="off")return now<st?"before":"after";return now<st?"before":now>en?"after":"live"}
let LASTLIVE=liveState();
function embedURL(u){if(!u)return null;const m=/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|live\/|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/.exec(u);if(m)return `https://www.youtube.com/embed/${m[1]}?autoplay=1&mute=1&playsinline=1`;if(/^https:\/\/(www\.|m\.|web\.)?facebook\.com\//.test(u))return `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(u)}&autoplay=true&mute=true`;return null}
function playerHTML(small){const s=D.site,e=embedURL(s.livestream),layer=small?"":'<div class="rx-layer" data-rx></div>';
  if(e&&!EMBED_BLOCKED)return `<div class="lp"><iframe src="${esc(e)}" title="Phát trực tiếp ${esc(s.eventTitle)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>${layer}</div>`;
  return `<div class="lp lp-fb">${layer}<div>${I.live}<p>${s.livestream?(EMBED_BLOCKED||!e?"Luồng phát mở trong tab mới. Bạn vẫn có thể quay lại đây để tham quan phòng truyền thống.":"Luồng phát đang tải…"):"Ban quản trị sẽ cập nhật đường dẫn phát trực tiếp tại đây."}</p>${s.livestream?`<a class="btn gold" href="${esc(safeURL(s.livestream))}" target="_blank" rel="noopener">Mở luồng phát trực tiếp</a>`:""}</div></div>`}
function peersLine(){if(!PEERS.known)return "";const live=liveState()==="live";return `<p class="peers">${PEERS.total.toLocaleString("vi-VN")} người đang tham quan cùng bạn${live?`, ${PEERS.watch.toLocaleString("vi-VN")} người đang xem trực tiếp`:""}${DEMO?" (minh họa)":""}</p>`}
function reactBar(){return RX_OK?`<div class="rxbar" role="group" aria-label="Thả cảm xúc">${Object.keys(RX).map(k=>`<button data-act="react" data-v="${k}" aria-label="${RXL[k]}" title="${RXL[k]}">${RX[k]}</button>`).join("")}</div>`:`<p class="note">Thả cảm xúc cần quyền Người đóng góp trong tổ chức của trường.</p>`}
const miniNote=btn=>`<div class="lp lp-fb"><div><p>Buổi lễ đang phát trong khung nhỏ ở góc màn hình.</p><button class="btn gold" data-act="liveClose">${btn}</button></div></div>`;
function liveHero(){const s=D.site;return `<section class="live-hero"><div class="lh-in"><div class="lh-head"><span class="onair"><i></i>Đang phát trực tiếp</span><h2>${esc(s.eventTitle)}</h2>${R("peersH",peersLine)}</div><div class="lh-grid"><div>${R("player",()=>MINI?miniNote("Đưa về khung lớn"):playerHTML())}</div><aside class="lh-side"><p>Cựu học sinh ở xa vẫn có thể cùng xem buổi lễ và dạo quanh phòng truyền thống cùng lúc.</p>${R("rxH",reactBar)}<button class="btn gold" data-act="liveMini">Vừa xem vừa tham quan</button><a class="btn ghost-d" href="#/dai-le">Gửi lời chúc</a></aside></div></div></section>`}
function evLive(){const st=liveState(),s=D.site,d=eventDate();if(st==="live")return MINI?miniNote("Xem ở đây"):playerHTML();
  if(st==="after")return `<div class="lp lp-fb"><div>${I.live}<p>Buổi lễ đã kết thúc. Cảm ơn các thế hệ thầy trò đã cùng hướng về trường.</p>${s.livestream?`<a class="btn gold" href="${esc(safeURL(s.livestream))}" target="_blank" rel="noopener">Xem lại buổi lễ</a>`:""}</div></div>`;
  const o=d?new Date(+d-30*6e4):null;return `<div class="lp lp-fb"><div>${I.live}<p>Khung phát trực tiếp tự mở ${o?`lúc ${o.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Ho_Chi_Minh"})} ngày ${o.toLocaleDateString("vi-VN",{timeZone:"Asia/Ho_Chi_Minh"})}`:"vào ngày lễ"}, ở cả trang này và gian trung tâm.</p>${DEMO||ME.edit?`<button class="btn gold" data-act="livePreview">Xem thử giao diện ngày lễ</button>`:""}</div></div>`}
function evLiveSide(){const live=liveState()==="live";return `<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px">${live?reactBar()+(MINI?"":`<button class="btn" data-act="liveMini">Vừa xem vừa tham quan</button>`)+(LIVEPREV?`<button class="btn ghost" data-act="livePreview">Tắt xem thử</button>`:""):""}${peersLine()}</div>`}
function spawnRx(k){const e=RX[k];if(!e)return;$$("[data-rx]").forEach(layer=>{const s=document.createElement("span");s.className="rx";s.textContent=e;s.style.left=(6+Math.random()*84)+"%";s.style.setProperty("--dx",(Math.random()*60-30).toFixed(0)+"px");layer.appendChild(s);setTimeout(()=>s.remove(),2700)})}
async function react(k){const now=Date.now();if(now-lastRx<350||!RX[k])return;lastRx=now;if(!ROOMC){spawnRx(k);return}
  try{await ROOMC.emit("camxuc",{k})}catch(e){if(e&&e.code==="not_permitted"){RX_OK=false;refreshRegions();toast("Thả cảm xúc cần quyền Người đóng góp trong tổ chức của trường.")}spawnRx(k)}}
function setPresence(){if(!ROOMC)return;const live=liveState()==="live";ROOMC.presence({page:PAGE.name||"home",watch:live&&(MINI||PAGE.name===""||PAGE.name==="dai-le")}).catch(()=>{})}
function initRoom(){const room=CAP.room;if(!room){if(DEMO){PEERS={total:214,watch:0,known:true};setInterval(()=>{if(document.hidden)return;const t=Math.max(150,PEERS.total+Math.round(Math.random()*8-3));PEERS={total:t,watch:liveState()==="live"?Math.round(t*.78):0,known:true};changed()},4000)}return}
  ROOMC=room;room.onPeers(ch=>{const v=ch.peers.filter(p=>p.kind==="viewer"),key=p=>p.by||p.peer,all=new Set(v.map(key)),w=new Set(v.filter(p=>p.presence&&p.presence.watch).map(key));PEERS={total:all.size,watch:w.size,known:true};changed()},()=>{});
  room.on("camxuc",m=>{const k=m&&m.data&&m.data.k;if(typeof k==="string"&&RX[k])spawnRx(k)},()=>{});setPresence()}
function liveMini(){MINI=true;updateLive();setPresence();refreshRegions();toast("Buổi lễ thu nhỏ ở góc màn hình. Bạn có thể tiếp tục tham quan các khu.")}
function liveClose(){MINI=false;updateLive();setPresence();refreshRegions()}
function liveExpand(){MINI=false;updateLive();setPresence();if(PAGE.name!=="")location.hash="#/";else refreshRegions()}
function livePreview(){LIVEPREV=!LIVEPREV;toast(LIVEPREV?"Đang xem thử giao diện ngày lễ trên máy của bạn.":"Đã tắt xem thử.");updateLive(true);setPresence()}
function updateLive(force){const st=liveState(),moved=st!==LASTLIVE;LASTLIVE=st;const strip=$("#liveStrip"),mini=$("#miniLive");
  if(st==="live"&&PAGE.name!==""){strip.hidden=false;strip.innerHTML=`<div class="in"><b><span class="onair"><i></i>Trực tiếp</span>${esc(D.site.eventTitle)}</b>${MINI?"":`<button data-act="liveMini">Xem cùng</button>`}<a href="#/">Về gian trung tâm</a></div>`}else{strip.hidden=true;strip.innerHTML=""}
  if(st==="live"&&MINI){if(!mini.__ok){mini.innerHTML=`<div class="mh"><b><span class="onair" style="padding:2px 8px;font-size:11px"><i></i>Trực tiếp</span></b><button data-act="liveExpand">Phóng to</button><button data-act="liveClose" aria-label="Đóng khung phát">✕</button></div>${playerHTML(true)}`;mini.__ok=true}mini.hidden=false}else{mini.hidden=true;mini.innerHTML="";mini.__ok=false}
  if((moved||force)&&(PAGE.name===""||PAGE.name==="dai-le")&&modal.hidden)render()}
setInterval(()=>updateLive(),5000);
setInterval(()=>{if(DEMO&&liveState()==="live"&&!document.hidden&&$$("[data-rx]").length&&Math.random()<.7)spawnRx(Object.keys(RX)[Math.floor(Math.random()*4)])},1100);
document.addEventListener("securitypolicyviolation",e=>{const d=String(e.effectiveDirective||e.violatedDirective||"");if(/frame|child|default/.test(d)&&/youtube|facebook/i.test(String(e.blockedURI||""))&&!EMBED_BLOCKED){EMBED_BLOCKED=true;refreshRegions();const m=$("#miniLive");m.__ok=false;updateLive()}});

function itemView(z,it){
  if(z.type==="awards")return awardView(it);
  if(z.type==="memories")return memView(it);
  const person=["leaders","staff","alumni"].includes(z.type);
  const media=hasVid(it)?`<video controls playsinline src="${it.videoData||"/_blob/"+esc(it.video)}"></video>`:`<img src="${imgOf(it,true)}" alt="${esc(it.title)}"${it.old&&it.gen?' class="old"':""}>`;
  let sub=it.sub;if(z.type==="leaders")sub=it.cat+", "+it.sub;if(z.type==="staff")sub=`${it.sub}. ${(STATUS.find(s=>s[0]===it.status)||[0,""])[1]}, ${it.start||"?"}${it.end?" – "+it.end:" – nay"}`;if(z.type==="gallery")sub=`${it.year}, ${it.cat}`;
  let extra="";
  if(z.type==="gallery"&&(it.tags||[]).length)extra+=`<h3>Người trong ảnh</h3><div class="tags">${it.tags.map(t=>`<button class="tag" data-act="tagFind" data-z="${z.id}" data-v="${esc(t)}">${I.user} ${esc(t)}</button>`).join("")}</div>`;
  if(z.type==="campus"&&(it.facts||[]).length)extra+=`<div class="facts">${it.facts.map(f=>`<span>${esc(f)}</span>`).join("")}</div>`;
  if(z.type==="leaders"){const T=tribOf(it.id);extra+=`<h3>Lời tri ân (${T.length})</h3>${T.length?T.map(t=>`<figure class="trib">${t.text?`<blockquote>${esc(t.text)}</blockquote>`:""}${t.audio?`<audio controls preload="none" src="/_blob/${esc(t.audio)}"></audio>`:""}<figcaption>${esc(t.name)}${t.khoa?", "+esc(t.khoa):""}, ${dstr(t.at)}</figcaption></figure>`).join(""):`<p class="note">Chưa có lời tri ân nào được đăng.</p>`}<button class="btn" data-act="tribForm" data-id="${esc(it.id)}">${I.mic} Gửi lời tri ân</button>`}
  return `<article class="mv${person?" person":""}"><div class="mv-img">${media}</div><div><p class="mv-zone">${esc(z.title)}</p><h2>${esc(it.title)}</h2><p class="mv-sub">${esc(sub)}</p>${it.desc?`<p class="mv-desc">${esc(it.desc)}</p>`:""}${z.type==="alumni"?`<span class="tag">${esc(it.cat)}</span>`:""}${extra}</div></article>`;
}

  const kind=a.k==="cert"?(/Giấy khen/i.test(a.title)?"Giấy khen":/chuẩn quốc gia/i.test(a.title)?"Bằng công nhận":"Bằng khen"):"";
  const vis=a.img||a.imgData?`<div class="velvet-big" style="aspect-ratio:auto;padding:14px"><img src="${awardImg(a)}" alt="${esc(a.title)}" style="max-height:60vh"></div>`:a.k==="cert"?`<div class="cert"><div class="cert-in"><span class="seal"></span><p class="nation">Cộng hòa xã hội chủ nghĩa Việt Nam<span>Độc lập – Tự do – Hạnh phúc</span></p><p class="by">${esc(a.by)}</p><h3>${kind}</h3><p>Tặng</p><p class="to">${esc(D.site.name)}</p><p>${esc(a.desc)}</p><p style="margin-top:8px;font-style:italic">Năm ${esc(a.year)}</p></div></div>`:`<div class="velvet-big"><img src="${awardImg(a)}" alt="${esc(a.title)}"></div>`;

/* ===================== Forms (visitors) ===================== */
function fld(id,label,input,hint){return `<label class="fld" id="f_${id}">${esc(label)}${input}${hint?`<span class="hint">${esc(hint)}</span>`:""}<span class="msg" data-msg></span></label>`}
const inp=(id,ph,max,val)=>`<input id="${id}" ${max?`maxlength="${max}"`:""} placeholder="${esc(ph||"")}" value="${esc(val||"")}" autocomplete="off">`;
function bad(id,msg){const el=$("#f_"+id);if(el){el.classList.add("bad");el.querySelector("[data-msg]").textContent=msg}return false}
function clearBad(){$$(".fld.bad").forEach(e=>{e.classList.remove("bad");e.querySelector("[data-msg]").textContent=""})}
function gate(){if(DEMO)return "";if(!ME.id)return `<p class="warnmsg">Hãy đăng nhập claude.ai để gửi. Khách chưa đăng nhập chỉ xem được nội dung đã duyệt.</p>`;return ""}
const FLAGWORDS=["đm","dm","vcl","vkl","địt","đéo","lừa đảo","ngu","óc chó","dở ẹc","cút"];
const flagged=t=>{const n=" "+norm(t)+" ";return FLAGWORDS.some(w=>n.includes(" "+norm(w)+" ")||n.includes(norm(w)+" "))};
function tribForm(id){const [,it]=findItem(id);openModal(`<h2 class="m-title">Lời tri ân gửi ${esc(it.title)}</h2><p class="note">Lời tri ân được Ban quản trị duyệt trước khi ghim vào thẻ hồ sơ.</p>${gate()}<div class="form">

  ${fld("tText","Lời tri ân",`<textarea id="tText" maxlength="600" placeholder="Viết đôi dòng gửi thầy cô…"></textarea>`)}
  <div class="fld">Ghi âm lời tri ân (không bắt buộc, tối đa 60 giây)<div class="rec" id="rec">${recUI()}</div><span class="hint">${canUpload()?"Trình duyệt sẽ hỏi quyền dùng micro.":"Ghi âm cần quyền Người đóng góp trong tổ chức của trường; bạn vẫn có thể gửi lời tri ân bằng chữ."}</span></div>
  <div class="actions"><button class="btn ghost" data-act="item" data-id="${esc(id)}">Quay lại hồ sơ</button><button class="btn" data-act="tribSend" data-id="${esc(id)}">Gửi lời tri ân</button></div></div>`,{narrow:true});recReset()}
let REC={mr:null,chunks:[],blob:null,url:null,t:null,start:0};
function recUI(){if(REC.mr&&REC.mr.state==="recording")return `<span class="dot"></span><span id="recT">00:00</span><button class="btn sm" data-act="recStop">Dừng</button>`;if(REC.blob)return `<audio controls src="${REC.url}"></audio><button class="btn sm ghost" data-act="recClear">Xóa, ghi lại</button>`;return `<button class="btn sm ghost" data-act="recStart" ${canUpload()?"":"disabled"}>${I.mic} Bắt đầu ghi âm</button>`}
function recReset(){if(REC.mr&&REC.mr.state==="recording")try{REC.mr.stop()}catch(e){}clearInterval(REC.t);if(REC.url)URL.revokeObjectURL(REC.url);REC={mr:null,chunks:[],blob:null,url:null,t:null,start:0}}
const recPaint=()=>{const el=$("#rec");if(el)el.innerHTML=recUI()};
async function recStart(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast("Trình duyệt này chưa hỗ trợ ghi âm. Bạn có thể viết lời tri ân.");return}
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||"";
    const mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);REC.mr=mr;REC.chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data)};

async function cmsSave(){clearBad();const z=ED.z,it=edRead();let ok=true;
  schemaOf(z.id).forEach(f=>{if(!f.req)return;if(f.t==="image"||f.t==="media"){if(!ED.file&&!it.img&&!hasVid(it)&&!it.gen&&!it.imgData)ok=bad("img","Hãy chọn ảnh.");return}if(it[f.k]===""||it[f.k]==null)ok=bad(f.k,"Không được bỏ trống.")});
  ["year","start","end"].forEach(k=>{if(it[k]!==""&&it[k]!=null&&(it[k]<1900||it[k]>2100))ok=bad(k,"Năm không hợp lệ.")});if(it.end&&it.start&&it.end<it.start)ok=bad("end","Năm nghỉ phải sau năm về trường.");
  if(!ok){const b=$(".fld.bad");if(b)b.scrollIntoView({block:"center",behavior:"smooth"});return}
  const btn=$('[data-act="cmsSave"]');btn.disabled=true;btn.textContent="Đang lưu…";
  try{if(ED.file){const r=await uploadBlob(ED.file.blob,ED.file.type);if(ED.file.kind==="video"){if(r.id){it.video=r.id;delete it.videoData}else{it.videoData=r.url;it.video=""}delete it.img;delete it.imgData}else{if(r.id){it.img=r.id;delete it.imgData;if(it.imgs&&it.imgs.length)it.imgs[0]=r.id}else{it.imgData=r.url;if(it.imgDatas&&it.imgDatas.length)it.imgDatas[0]=r.url}delete it.video}delete it.gen;it.old=false}
    const items=zoneItems(z.id).slice(),i=items.findIndex(x=>x.id===it.id);if(i>=0)items[i]=it;else items.unshift(it);
    if(await saveZone(z.id,items)){closeModal();toast(DEMO?"Đã lưu (bản xem thử).":"Đã lưu thay đổi.")}}
  catch(e){toast(e&&e.code==="not_granted"?"Tài khoản chưa có quyền tải tệp lên.":errMsg(e))}
  if(btn.isConnected){btn.disabled=false;btn.textContent="Lưu thay đổi"}}
async function cmsDel(id){const z=ZMAP[CMS.zone],it=zoneItems(z.id).find(x=>x.id===id);if(!it||!confirm(`Xóa “${it.title}” khỏi khu ${z.title}?`))return;if(await saveZone(z.id,zoneItems(z.id).filter(x=>x.id!==id)))toast("Đã xóa.")}
async function cmsMove(id,d,toId){const items=zoneItems(CMS.zone).slice(),i=items.findIndex(x=>x.id===id);if(i<0)return;let j=toId?items.findIndex(x=>x.id===toId):i+d;if(j<0||j>=items.length||j===i)return;const [m]=items.splice(i,1);items.splice(j,0,m);await saveZone(CMS.zone,items)}
let MODT="gb";

      return head+`<div class="rows">${rows.map(([uid,x])=>{const txt=x.msg||x.text||x.caption||x.note||((x.title||"")+" "+(x.story||"")),fl=flagged(txt+" "+(x.name||""));let body="";

        if(MODT==="tributes"){const [,L]=findItem(x.leaderId);body=`<small>Gửi: ${esc(L?L.title:"(hồ sơ đã xóa)")}</small>${x.text?`<p>${esc(x.text)}</p>`:""}${x.audio?`<audio controls preload="none" src="/_blob/${esc(x.audio)}"></audio>`:""}`}
        if(MODT==="photos")body=`<img src="${x.asset?"/_blob/"+esc(x.asset):x.imgData||(x.gen?genURL(x.gen,x.old):NOIMG)}" alt=""><p>${esc(x.caption)}</p><small>Năm chụp: ${esc(x.year||"không rõ")}</small>`;
        if(MODT==="donations")body=`<p><b>${vnd(x.amount)}</b>${x.note?`, ${esc(x.note)}`:""}</p>`;
        if(MODT==="memories"){const th=(x.assets||[]).map(id=>"/_blob/"+id).concat(DEMO?(x.imgDatas||[]):[]).concat(DEMO&&x.gen?[genURL(x.gen,x.old)]:[]);body=`<div class="thumbs" style="justify-content:flex-start;margin:8px 0">${th.slice(0,5).map(u=>`<img src="${esc(u)}" alt="" style="width:110px;height:82px">`).join("")}</div><p><b>${esc(x.title)}</b> (${esc(memT(x.type))}${x.year?", năm "+esc(x.year):""})</p><p>${esc(x.story)}</p><small>Sẽ tự xếp vào: Góc ký ức, ${esc(((genOf(+((/(\d{4})/.exec(x.khoa||"")||[0,0])[1]))||["chưa rõ thế hệ"])[0]).toLowerCase())}</small>`}
        return `<div class="m-item"><div><b>${esc(x.name||"Không tên")}</b>${x.khoa?`, ${esc(x.khoa)}`:""}${fl?`<span class="flag">Cần xem kỹ</span>`:""}<br><small>${new Date(x.at).toLocaleString("vi-VN")}</small>${body}</div><div class="ra" style="display:flex;flex-direction:column;gap:6px"><button class="btn sm ok" data-act="modOk" data-u="${esc(uid)}" data-id="${esc(x.id)}">${MODT==="donations"?"Xác nhận":MODT==="memories"?"Duyệt và trưng bày":"Duyệt"}</button><button class="btn sm danger" data-act="modNo" data-u="${esc(uid)}" data-id="${esc(x.id)}">Xóa</button></div></div>`}).join("")}</div>`}

async function inboxRemove(uid,kind,id){const b=clone(D.inbox[uid]||{});b[kind]=(b[kind]||[]).filter(x=>x.id!==id);if(DEMO){D.inbox[uid]=b;if(uid==="me"&&D.myInbox)D.myInbox[kind]=(D.myInbox[kind]||[]).filter(x=>x.id!==id);changed();return}b.updatedAt=Date.now();await wdoc("inbox/"+uid,b)}
async function modOk(uid,id){const x=((D.inbox[uid]||{})[MODT]||[]).find(e=>e.id===id);if(!x)return;
  if(MODT==="photos")return photoApprove(uid,x);
  if(MODT==="memories")return memApprove(uid,x);
  try{const base={name:x.name,khoa:x.khoa||"",at:x.at,approvedAt:Date.now(),approvedBy:ME.id||""};let col,doc;
    if(MODT==="gb"){col="guestbook";doc=Object.assign(base,{msg:x.msg})}
    if(MODT==="tributes"){col="tributes";doc=Object.assign(base,{leaderId:x.leaderId,text:x.text||"",audio:x.audio||""})}
    if(MODT==="donations"){col="donations";doc=Object.assign(base,{amount:+x.amount||0})}
    if(DEMO){const arr=col==="guestbook"?"guestbook":col;D[arr]=[Object.assign({_id:newId()},doc)].concat(D[arr])}else await CAP.db.collection(col).add(doc);
    await inboxRemove(uid,MODT,id);toast(MODT==="donations"?"Đã xác nhận khoản đóng góp.":"Đã duyệt và đăng công khai.")}catch(e){toast(errMsg(e))}}

  <h2 class="grp">Nhạc nền</h2>${fld("cMt","Tên bài hát",`<input data-cf="musicTitle" maxlength="80" value="${esc(s.musicTitle)}">`)}<div class="fld">Tệp nhạc<label class="drop"><input type="file" accept="video/mp4,video/webm,audio/mp4,.m4a,.mp4,.webm" data-upl="music"><span>${s.music?"Đã có tệp nhạc. Chọn tệp khác để thay.":"Chưa có tệp, trang đang dùng giai điệu minh họa."}</span></label><span class="hint">Dùng định dạng M4A, MP4 hoặc WebM, dưới 20 MB. Tệp MP3 cần chuyển sang M4A trước.</span></div>
  <h2 class="grp">Kỷ yếu 40 năm</h2><div class="fld">Các trang kỷ yếu (ảnh chụp hoặc xuất từ PDF thành ảnh)<label class="drop"><input type="file" accept="image/*" multiple data-upl="yearbook"><span>${(s.yearbook||[]).length?`Đã có ${(s.yearbook||[]).length} trang. Chọn thêm ảnh để nối tiếp.`:"Chưa có trang nào, trang đang dùng kỷ yếu minh họa."}</span></label>${(s.yearbook||[]).length?`<button class="btn sm danger" data-act="ybClear" style="justify-self:start">Xóa toàn bộ trang kỷ yếu</button>`:""}</div>
  <div class="actions" style="position:sticky;bottom:0;background:var(--bg);padding:12px 0"><button class="btn" data-act="cfgSave">Lưu cấu hình</button></div></div>`}
function cfgRead(){const s=clone(D.site);$$("[data-cf]").forEach(el=>{const k=el.dataset.cf;let v=el.value.trim();if(k==="fundGoal")v=+v.replace(/\D/g,"")||0;if(k==="liveHours")v=Math.max(1,Math.min(12,+v||4));if(k==="history")v=v.split("\n").map(l=>l.split("|")).filter(p=>p.length>=2&&p[0].trim()&&p[1].trim()).map(p=>[p[0].trim(),p.slice(1).join("|").trim()]);s[k]=v});return s}
async function cfgSave(){const s=cfgRead();if(!s.name)return toast("Tên trường không được bỏ trống.");if(s.campaignStart&&s.campaignEnd&&s.campaignEnd<s.campaignStart)return toast("Ngày đóng cổng phải sau ngày mở cổng.");if(s.livestream&&!/^https?:\/\//i.test(s.livestream))return toast("Đường dẫn livestream cần bắt đầu bằng https://");if(await saveSite(s))toast("Đã lưu cấu hình.")}
async function cfgUpload(kind,files){if(DEMO){toast("Bản xem thử chưa lưu tệp. Hãy dùng bản đã chia sẻ trên claude.ai.");return}if(!CAP.assets){toast("Tài khoản chưa có quyền tải tệp lên.");return}
  try{const s=cfgRead();if(kind==="qr"){const b=await resizeImage(files[0],900);s.qr=(await CAP.assets.upload(b,{type:"image/jpeg"})).id}
    if(kind==="music"){const f=files[0],ext=(f.name.split(".").pop()||"").toLowerCase(),type=ext==="webm"?"video/webm":"video/mp4";if(!["m4a","mp4","webm"].includes(ext))return toast("Hãy dùng tệp M4A, MP4 hoặc WebM.");if(f.size>20*1048576)return toast("Tệp nhạc quá 20 MB.");s.music=(await CAP.assets.upload(f,{type})).id;MU.audio=null}
    if(kind==="yearbook"){const ids=[];for(const f of files){const b=await resizeImage(f,1600);ids.push((await CAP.assets.upload(b,{type:"image/jpeg"})).id)}s.yearbook=(s.yearbook||[]).concat(ids);FB.pages=[]}
    if(await saveSite(s)){toast("Đã tải lên.");render()}}catch(e){toast(errMsg(e))}}
function aBackup(){return `<h1>Sao lưu và khôi phục</h1><p class="lead">Tải bản sao lưu toàn bộ nội dung (thông tin trường, 7 khu trưng bày, lời chúc, lời tri ân, đóng góp, ghim bản đồ) về máy dưới dạng tệp JSON. Ảnh và video nằm trong kho tệp của trang; bản sao lưu giữ mã tệp để khôi phục.</p>
  <div class="ev-grid"><div class="card"><h2>Sao lưu</h2><p class="lead">Nên sao lưu sau mỗi đợt cập nhật lớn.</p><button class="btn" data-act="backup">Tải bản sao lưu</button></div>
  <div class="card"><h2>Khôi phục</h2><p class="lead">Ghi đè thông tin trường và 7 khu trưng bày bằng dữ liệu trong tệp sao lưu. Lời chúc và ghim bản đồ không bị thay đổi.</p><label class="btn ghost" style="cursor:pointer"><input type="file" accept="application/json,.json" data-upl="restore" hidden>Chọn tệp sao lưu</label></div></div>`}
async function backup(){const data={kind:"phong-truyen-thong-backup",version:1,exportedAt:new Date().toISOString(),site:D.site,zones:D.zones,guestbook:D.guestbook,tributes:D.tributes,donations:D.donations,pins:D.pins};const name=`sao-luu-phong-truyen-thong-${dkey(new Date())}.json`,txt=JSON.stringify(data,null,1);
  if(CAP.dl){try{await CAP.dl.save({filename:name,data:txt});toast("Đã tải bản sao lưu.")}catch(e){if(e&&e.code!=="declined")toast("Chưa tải được bản sao lưu ở đây.")}return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}catch(e){toast("Chưa tải được bản sao lưu ở đây.")}}
async function restore(file){let data;try{data=JSON.parse(await file.text())}catch(e){return toast("Tệp không đúng định dạng sao lưu.")}if(data.kind!=="phong-truyen-thong-backup"||!data.zones)return toast("Tệp không phải bản sao lưu của phòng truyền thống.");
  if(!confirm("Khôi phục sẽ ghi đè thông tin trường và 7 khu trưng bày hiện tại. Tiếp tục?"))return;
  if(await saveSite(Object.assign(clone(DEFAULT_SITE),data.site||{}))){for(const z of ZONES)if(Array.isArray(data.zones[z.id]))await saveZone(z.id,data.zones[z.id]);toast("Đã khôi phục dữ liệu.")}}

/* ===================== Modal & toast ===================== */
const modal=$("#modal"),mBody=$("#mBody"),mNav=$("#mNav"),mPanel=$("#mPanel");let nav=null,lastFocus=null;
function openModal(html,o){o=o||{};lastFocus=document.activeElement;nav=o.nav||null;mPanel.className="m-panel"+(o.narrow?" narrow":"")+(o.book?" mbook":"");mBody.innerHTML=html;mBody.scrollTop=0;mNav.hidden=!nav||nav.list.length<2;if(nav)$("#mCount").textContent=`${nav.i+1} / ${nav.list.length}`;modal.hidden=false;document.body.style.overflow="hidden";$("#mClose").focus()}
function closeModal(silent){if(modal.hidden)return;modal.hidden=true;mBody.innerHTML="";nav=null;document.body.style.overflow="";recReset();if(!silent&&lastFocus&&document.contains(lastFocus))lastFocus.focus()}
function step(d){if(!nav)return;nav.i=(nav.i+d+nav.list.length)%nav.list.length;mBody.innerHTML=nav.render(nav.list[nav.i]);mBody.scrollTop=0;$("#mCount").textContent=`${nav.i+1} / ${nav.list.length}`}
$("#mPrev").onclick=()=>step(-1);$("#mNext").onclick=()=>step(1);
let sx=null;mBody.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});mBody.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)<60)return;if($("#book"))fbTurn(dx<0?1:-1);else if(nav)step(dx<0?1:-1)});
addEventListener("keydown",e=>{if(modal.hidden)return;if(e.key==="Escape")closeModal();else if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;else if(e.key==="ArrowRight"){if($("#book"))fbTurn(1);else step(1)}else if(e.key==="ArrowLeft"){if($("#book"))fbTurn(-1);else step(-1)}});
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true},4200)}
function openItem(id){const [z,it]=findItem(id);if(!z)return;let list=zoneItems(z.id);
  if(z.type==="leaders")list=list.filter(x=>(x.cat==="Hiệu trưởng")===(it.cat==="Hiệu trưởng"));
  if(z.type==="staff")list=list.filter(x=>(x.status==="current")===(it.status==="current"));
  const i=Math.max(0,list.indexOf(it));openModal(itemView(z,it),{nav:{list,i,render:x=>itemView(z,x)}})}

/* ===================== Events ===================== */
const ACT={
  memForm,memSend,memImg:el=>{const m=$("#memMain");if(m)m.src=el.dataset.src;$$(".memg button").forEach(b=>b.setAttribute("aria-pressed",String(b===el)))},
  boxDraw,boxGen:el=>{BOX.gen=el.dataset.v;BOX.cur=null;try{localStorage.setItem("ptt-boxgen",BOX.gen)}catch(e){}refreshRegions()},
  liveMini,liveClose,liveExpand,livePreview,react:el=>react(el.dataset.v),
  item:el=>openItem(el.dataset.id),decision:()=>openModal(decisionView()),history:()=>openModal(historyView(),{narrow:true}),flipbook:openFlip,music:musicToggle,
  fb:el=>fbTurn(+el.dataset.v),
  filt:el=>{const z=PAGE.arg;const st=zs(z);st[el.dataset.k]=el.dataset.v;$$(`[data-act="filt"][data-k="${el.dataset.k}"]`).forEach(b=>b.setAttribute("aria-pressed",String(b===el)));refreshRegions()},
  tagFind:el=>{closeModal(true);const st=zs(el.dataset.z);st.tag=el.dataset.v;st.dec="Tất cả";st.cat="Tất cả";if(PAGE.arg!==el.dataset.z)location.hash="#/khu/"+el.dataset.z;else render()},
  tribForm:el=>tribForm(el.dataset.id),tribSend:el=>tribSend(el.dataset.id),recStart,recStop:()=>{try{REC.mr.stop()}catch(e){}},recClear:()=>{recReset();recPaint()},
  pinForm:()=>pinForm(),pinSave,pinDel,mapPick:()=>{closeModal(true);if(PAGE.arg!=="cuu-hoc-sinh"){location.hash="#/khu/cuu-hoc-sinh";setTimeout(()=>ACT.mapPick(),300);return}MAP.pick=true;$("#mapWrap").classList.add("pick");$("#mapBanner").hidden=false;$("#mapWrap").scrollIntoView({block:"center",behavior:"smooth"})},
  mapView:el=>el.dataset.v==="vn"?setMap(742,178,110):setMap(0,0,1000),mapZoom:el=>{const f=+el.dataset.v>0?1/1.6:1.6,nw=MAP.w*f;setMap(MAP.x+(MAP.w-nw)/2,MAP.y+(MAP.h-nw/2)/2,nw)},
  pinPop:(el,e)=>{const arr=CLUSTERS[el.dataset.key]||[],pop=$("#mapPop"),w=$("#mapWrap").getBoundingClientRect();if(!arr.length)return;const cities=[...new Set(arr.map(p=>p.city))];pop.innerHTML=`<h4>${esc(cities.slice(0,3).join(", "))}${cities.length>3?"…":""} (${arr.length})</h4>${arr.map(p=>`<p><b>${esc(p.name)}</b><br>${esc(p.khoa)}<br>${esc(p.work)}, ${esc(p.city)}</p>`).join("")}`;pop.hidden=false;pop.style.left=Math.min(w.width-262,Math.max(8,e.clientX-w.left+10))+"px";pop.style.top=Math.min(w.height-120,Math.max(8,e.clientY-w.top+10))+"px"},
  gbSend,donSend,upSend,candle:lightCandle,
  quizPick:el=>{if(QZ.pick!=null)return;QZ.pick=+el.dataset.v;if(QZ.pick===QUIZ[QZ.i].c)QZ.score++;refreshRegions()},quizNext:()=>{QZ.pick=null;QZ.i++;if(QZ.i>=QUIZ.length)QZ.done=true;refreshRegions()},quizRestart:()=>{QZ={i:0,score:0,pick:null,done:false};refreshRegions()},
  cmsZone:el=>{CMS.zone=el.dataset.v;CMS.q="";render()},cmsNew:()=>cmsEdit(null),cmsEdit:el=>cmsEdit(el.dataset.id),cmsSave,cmsDel:el=>cmsDel(el.dataset.id),cmsMove:el=>cmsMove(el.dataset.id,+el.dataset.v),
  tagDel:el=>{const box=el.closest("[data-tags]"),k=box.dataset.tags;ED.it[k]=(ED.it[k]||[]).filter(t=>t!==el.dataset.v);el.parentElement.remove();$("#edPrev").innerHTML=edPrev()},
  modTab:el=>{MODT=el.dataset.v;refreshRegions()},modOk:el=>modOk(el.dataset.u,el.dataset.id),modNo:el=>modNo(el.dataset.u,el.dataset.id),photoOk:el=>photoOk(el.dataset.u,el.dataset.id),
  pinHide:el=>pinHide(el.dataset.id),pinRm:el=>pinRm(el.dataset.id),gbRm:el=>gbRm(el.dataset.id),
  roleDel:el=>{const m=Object.assign({},(D.roles.members||{}));delete m[el.dataset.id];if(confirm("Thu hồi quyền quản trị của thành viên này?"))rolesSave(m,D.roles.names)},
  roleAdd:el=>{const m=Object.assign({},(D.roles.members||{}));m[el.dataset.id]=$("#rRole").value;rolesSave(m,D.roles.names);$("#rRes").innerHTML="";$("#rq").value=""},
  cfgSave,ybClear:async()=>{if(!confirm("Xóa toàn bộ trang kỷ yếu đã tải lên?"))return;const s=cfgRead();s.yearbook=[];FB.pages=[];if(await saveSite(s))render()},backup
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el,e)}});
modal.addEventListener("click",e=>{if(e.target.closest("[data-close]"))closeModal()});
let qT=null;
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.in){const k=t.dataset.in;
    if(k==="baRange"){$("#ba").style.setProperty("--p",t.value+"%");return}
    if(k==="cmsq"){CMS.q=t.value;clearTimeout(qT);qT=setTimeout(refreshRegions,150);return}
    if(["q","tag"].includes(k)){zs(PAGE.arg)[k]=t.value;clearTimeout(qT);qT=setTimeout(refreshRegions,150);return}}
  if(t.id==="rq"&&CAP.user){CAP.user.search(t.value).then(hits=>{const box=$("#rRes");if(!box)return;box.innerHTML=hits.length?`<div class="results">${hits.map(h=>`<button data-act="roleAdd" data-id="${esc(h.id)}"><img src="${esc(h.avatarUrl)}" alt=""><span></span></button>`).join("")}</div>`:"";$$(".results button span",box).forEach((s,i)=>{s.textContent=hits[i].name+(hits[i].guest?" (khách ngoài tổ chức)":"")})})}
  if(t.dataset.ed&&ED){edRead();$("#edPrev").innerHTML=edPrev()}});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.dataset.in==="ba1"||t.dataset.in==="ba2"){zs("co-so-vat-chat")[t.dataset.in]=+t.value;refreshRegions();return}
  if(t.dataset.in==="roleSet"){const m=Object.assign({},(D.roles.members||{}));m[t.dataset.id]=t.value;rolesSave(m,D.roles.names);return}
  if(t.id==="mFiles"){memFiles([...t.files]);t.value="";return}
  if(t.id==="uFile"&&t.files[0]){upFile=t.files[0];const p=$("#uPrev");p.src=URL.createObjectURL(upFile);p.hidden=false;$("#uHint").textContent=upFile.name;return}
  if(t.id==="edFile"&&t.files[0]){try{const m=await prepMedia(t.files[0]);ED.file=Object.assign(m,{url:URL.createObjectURL(m.blob)});$("#edMedia").innerHTML=edMediaHTML();$("#edPrev").innerHTML=edPrev()}catch(err){toast(errMsg(err))}return}
  if(t.dataset.upl){const k=t.dataset.upl;if(k==="restore"){if(t.files[0])restore(t.files[0]);t.value="";return}if(t.files.length)cfgUpload(k,[...t.files]);return}
  if(t.dataset.ed&&ED){edRead();$("#edPrev").innerHTML=edPrev()}});
document.addEventListener("keydown",e=>{const t=e.target;if(t.dataset&&t.dataset.tagin&&e.key==="Enter"){e.preventDefault();const v=t.value.trim();if(!v||!ED)return;const k=t.dataset.tagin;ED.it[k]=(ED.it[k]||[]);if(!ED.it[k].includes(v)){ED.it[k].push(v);t.insertAdjacentHTML("beforebegin",`<span>${esc(v)}<button type="button" data-act="tagDel" data-v="${esc(v)}" aria-label="Bỏ ${esc(v)}">×</button></span>`)}t.value="";$("#edPrev").innerHTML=edPrev()}});
["dragover","dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest(".drop");if(!d)return;e.preventDefault();d.classList.toggle("over",ev==="dragover");if(ev==="drop"&&e.dataTransfer.files.length){const inp=d.querySelector("input[type=file]");try{inp.files=e.dataTransfer.files;inp.dispatchEvent(new Event("change",{bubbles:true}))}catch(_){}}}));
let dragId=null;
document.addEventListener("dragstart",e=>{const r=e.target.closest&&e.target.closest(".r[draggable=true]");if(r){dragId=r.dataset.id;e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}}});
document.addEventListener("dragover",e=>{const r=e.target.closest&&e.target.closest(".r");if(r&&dragId){e.preventDefault();$$(".r.over").forEach(x=>x.classList.remove("over"));r.classList.add("over")}});
document.addEventListener("drop",e=>{const r=e.target.closest&&e.target.closest(".r");if(r&&dragId){e.preventDefault();const to=r.dataset.id;$$(".r.over").forEach(x=>x.classList.remove("over"));if(to!==dragId)cmsMove(dragId,0,to);dragId=null}});
document.addEventListener("dragend",()=>{dragId=null;$$(".r.over").forEach(x=>x.classList.remove("over"))});
function afterRender(){if(PAGE.name==="khu"&&PAGE.arg==="cuu-hoc-sinh")bindMap();const dl=$("#tagList"),ti=$('[data-in="tag"]');if(dl&&ti)ti.setAttribute("list","tagList")}

route();initCaps();
})();
</script>
